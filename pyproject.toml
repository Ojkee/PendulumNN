[project]
name = "PendulumNN"
version = "0.1.0"
description = "Controlling Pendulum with Neural Network"
requires-python = ">=3.11"
dependencies = [
    "torch==2.4.1+cu118",
    "pygame",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv]
index-url = "https://pypi.org/simple"
package = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[project.scripts]
pendulumnn = "PendulumNN.__main__:main"
